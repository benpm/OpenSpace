		// Variable for js libarary
		var openspace = null;
		// Helper function for nicely fading groups of trails
		var showTrails = (objects) => {
			objects.map(async (object) => {
				// openspace-api.js now unwraps Lua return values, and getPropertyValue
				// was renamed to propertyValue
				const isEnabled = await openspace.propertyValue("Scene." + object + "Trail.Renderable.Enabled");
				if (!isEnabled) {
					openspace.setPropertyValue("Scene." + object + "Trail.Renderable.Opacity", 0)
					openspace.setPropertyValue("Scene." + object + "Trail.Renderable.Enabled", true)
				}
				openspace.setPropertyValue("Scene." + object + "Trail.Renderable.Opacity", 1, 1)
			})
		}

		// Helper function to fade out and then disable trails
		async function hideAllTrails() {
			const duration = 1;
			openspace.setPropertyValue("Scene.*Trail.Renderable.Opacity", 0, 1)
			setTimeout(() => {
				openspace.setPropertyValue("Scene.*Trail.Renderable.Enabled", false)
			}, duration * 1000)
		}
		// Helper function to set the focus target
		var setFocus = (focus) => {
			openspace.setPropertyValue('NavigationHandler.OrbitalNavigator.Anchor', focus);
			openspace.setPropertyValue('NavigationHandler.OrbitalNavigator.RetargetAnchor', null);
		}

function mapButtons(openspace) {
    const mainDiv = document.getElementById('main');
    mainDiv.innerHTML = "";
    buttonGroups.map((action) => {
        var cardHTML = "<div class='card'><h2>" + action.title + "</h2>";
        const currentButtons = action.getButtons ? action.getButtons() : action.buttons;
        if (currentButtons) {
            Object.keys(currentButtons).map(buttonLabel => {
                let fn = currentButtons[buttonLabel].toString(); // Convert function code to string
                // Inject the actual hard drive path into both the label AND the script string
                let finalLabel = buttonLabel.replace(/ROOT\//g, openSpaceRoot);
                let finalFn = fn.replace(/ROOT\//g, openSpaceRoot);
                cardHTML += "<button onClick=\"(" + finalFn + ")(event)\">" + finalLabel + "</button>";
            });
        }
        cardHTML += "</div>";
        mainDiv.innerHTML += cardHTML;
    });
}

	// Helper function to connect to openspace
	var connectToOpenSpace = (hostArg) => {
		var input = document.getElementById('ipaddress');
		var host = hostArg || (input && input.value) || 'localhost';
		var api = window.openspaceApi(host, 4682);
		api.onDisconnect(() => {
			console.log("disconnected");
			// Restore "container" ID to avoid the Null error
			document.getElementById('container').className = "disconnected";
			document.getElementById('connection-status').innerHTML = `
				Connect to OpenSpace:
				<input id="ipaddress" type="text" value="${host}" />
				<button onClick="connectToOpenSpace();">Connect</button>`;
			openspace = null;
		});
		api.onConnect(async () => {
			try {
				document.getElementById('container').className = "connected";
				// Use textContent for status to preserve the layout
				document.getElementById('connection-status').innerHTML = "<b>Connected to OpenSpace</b>";
				openspace = await api.library();
				// Default path (the current openspace-api.js returns the value directly,
				// not wrapped in a {1: ...} table)
				openSpaceRoot = await openspace.absPath("${BASE}");
				openSpaceRoot = openSpaceRoot.replace(/\\/g, "/"); // Normalize backslashes to forward slashes
				openSpaceRoot = openSpaceRoot + "/";
				mapButtons(openspace);
			} catch (e) {
				console.log('OpenSpace library could not be loaded:', e);
			}
		});
		api.connect();
	};
